    <h2>FORMULIR PERMINTAAN PROYEK</h2>
    <form>
      <label>Nama:</label>
      <input type="text" placeholder="Masukkan nama Anda" required>

      <label>Email:</label>
      <input type="email" placeholder="Masukkan email Anda" required>

      <label>Jenis Layanan:</label>
      <select>
        <option>Pembuatan Website</option>
        <option>Desain UI/UX</option>
        <option>Konsultasi Teknologi</option>
      </select>

      <label>Deskripsi Proyek:</label>
      <textarea placeholder="Tuliskan detail proyek Anda..." required></textarea>

      <label><input type="checkbox" required> Saya menyetujui syarat dan ketentuan</label>

      <button type="submit">Kirim</button>
    </form>
